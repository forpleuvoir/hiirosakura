[versions]
java = "25"
#kotlin
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

#other
#compose
composeMinecraft = "0.2.0"
jexl = "3.6.2"
logging = "1.3.5"

#minecraft
minecraft = "26.3"
minecraftRange = "[26.3,26.4)"

#mixin
mixin = "0.8.7"
mixinExtras = "0.5.5"

#Ibukigourd
ibukigourd = "1.1.0-alpha"

#Fabric checks these on https://fabricmc.net/versions.html
fabricApi = "0.165.0+26.3"
fabricLoader = "0.20.1"
fabricLoom = "1.19.3"

fabricKotlin = "1.14.2+kotlin.2.4.21"
modMenu = "21.0.0"

# NeoForge, see https://projects.neoforged.net/ for new versions
neoforgedModDev = "2.0.148"
neoForm = "26.3-1"
neoforge = "26.3.0.99"
neoforgeRange = "[26.3,)"

forgeKotlin = "6.4.0"
forgeKotlinRange = "[6.4.0,)"

[libraries]
#Minecraft
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }


#Ibukigourd
ibukigourd-common = { group = "moe.forpleuvoir", name = "ibukigourd-common-26.3", version.ref = "ibukigourd" }
ibukigourd-fabric = { group = "moe.forpleuvoir", name = "ibukigourd-fabric-26.3", version.ref = "ibukigourd" }
ibukigourd-neoforge = { group = "moe.forpleuvoir", name = "ibukigourd-neoforge-26.3", version.ref = "ibukigourd" }

#compose-minecraft
composeMinecraft-common = { group = "moe.forpleuvoir", name = "compose_minecraft-common-26.3", version.ref = "composeMinecraft" }

#Fabric
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
fabricKotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabricKotlin" }
modMenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modMenu" }

#Neoforge
forgeKotlin = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "forgeKotlin" }

#kotlin
kotlinStdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinReflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinxCoroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxSerialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

jexl = { group = "org.apache.commons", name = "commons-jexl3", version.ref = "jexl" }
logging = { group = "commons-logging", name = "commons-logging", version.ref = "logging" }

[bundles]
kotlin = ["kotlinStdlib", "kotlinReflect", "kotlinxCoroutines", "kotlinxSerialization"]
jexl = ["jexl", "logging"]

[plugins]
fabricLoom = { id = "net.fabricmc.fabric-loom", version.ref = "fabricLoom" }
neoforgedModDev = { id = "net.neoforged.moddev", version.ref = "neoforgedModDev" }
