chat: 
  chat_inject: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    inject_mapping: 
      - 
        first: ".*"
        second: "#{message}"
  chat_filter: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    filter_mapping: []
  chat_bubble: 
    enable: false
    only_y_rotation: true
    offset: 
      x: 0.0
      y: 0.0
    scale: 
      x: 1.0
      y: 1.0
    use_max_light: false
    max_width: 120.0
    texture_color: "#FF8899"
    text_color: "#FFFFFF"
    duration: "10s"
    fade_in_duration: "250ms"
    fade_out_duration: "250ms"
    server_chat_bubble_config: 
      "#single": 
        regex: "<(?<name>[^>]+)>\\s(?<message>.+)"
        enable_uuid: false
        enable_profile: false
