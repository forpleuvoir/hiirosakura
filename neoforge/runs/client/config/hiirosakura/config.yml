gameplay: 
  auto_rebirth: 
    keybind: 
      keys: []
    enabled: false
  chain_doors: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    activation_key: key.keyboard.left.shift
    rules: 
      - 
        origin_door: 
          mode: AllMatch
          entries: 
            - 
              type: tag
              mode: Include
              tag: "minecraft:mob_interactable_doors"
        chain_door: 
          mode: AllMatch
          entries: 
            - 
              type: tag
              mode: Include
              tag: "minecraft:mob_interactable_doors"
        key_toggle_mode: false
        strategy: 
          type: neighborhood
          radius: 1
          shape: CUBE
          same_block: true
          sync_state: true
          limit: 1
      - 
        origin_door: 
          mode: AllMatch
          entries: 
            - 
              type: tag
              mode: Include
              tag: "minecraft:trapdoors"
            - 
              type: block
              mode: Exclude
              block: "minecraft:iron_trapdoor"
        chain_door: 
          mode: AllMatch
          entries: 
            - 
              type: tag
              mode: Include
              tag: "minecraft:trapdoors"
            - 
              type: block
              mode: Exclude
              block: "minecraft:iron_trapdoor"
        key_toggle_mode: true
        strategy: 
          type: recursive
          same_block: true
          sync_state: true
          limit: 8
  item_use_intercept: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    matcher: {}
  item_drop_intercept: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    matcher: {}
  block_break_protection: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    matcher: 
      "Budding Amethyst": 
        first: 
          mode: AnyMatch
          entries: 
            - 
              type: item
              mode: Include
              item: "minecraft:air"
            - 
              type: item
              mode: Exclude
              item: "minecraft:air"
        second: 
          mode: AnyMatch
          entries: 
            - 
              type: block
              mode: Include
              block: "minecraft:budding_amethyst"
  gliding: 
    disable_firework_rocket_interaction_when_gliding: 
      keybind: 
        keys: []
      enabled: false
    quick_use_firework_rocket__when_gliding: 
      keys: []
    firework_matcher: 
      mode: AnyMatch
      entries: 
        - 
          type: item
          mode: Include
          item: "minecraft:firework_rocket"
  auto_switch_elytra: 
    enable: 
      keybind: 
        keys: []
      enabled: false
    slot: CHEST
    switchable_equip: 
      mode: AnyMatch
      entries: 
        - 
          type: item
          mode: Include
