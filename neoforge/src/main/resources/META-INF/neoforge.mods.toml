modLoader = "kotlinforforge"
loaderVersion = "${forge_kotlin_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/forpleuvoir/hiirosakura/issues"
[[mods]]
side = "CLIENT"
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/hiirosakura"
logoFile = "${mod_id}.png"
logoBlur = false
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[modproperties.hiirosakura]
package = "moe.forpleuvoir.hiirosakura"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ibukigourd"
type = "required"
versionRange = "[${ibukigourd_version}]"
ordering = "NONE"
side = "BOTH"

